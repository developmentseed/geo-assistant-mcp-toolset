[project]
name = "geo-assistant-mcp-toolset"
version = "0.1.0"
description = "The geo-assistant workflow as MCP toolsets - Overture place lookup, buffering and spatial SQL over DuckDB - built on the mcp-toolsets template."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The shared runtime, installed from PyPI — mcp_runtime (mcp-serve /
    # mcp-index), mcp_cli, mcp_toolset, and with [api] the agent plus its
    # AG-UI HTTP API and bundled web client (mcp_agent_api), which
    # `agent_app.py` serves. The toolset images sync with `--package` and so
    # never see the extra. Upgrade by bumping this range and running `uv lock`.
    "mcp-toolsets-runtime[api]<0.11.0,>=0.10.2",
    "duckdb-analyst",
    # Serves agent_app locally. Not part of the runtime's [api] extra.
    "uvicorn<0.53.0,>=0.52.3",
    "naip-imagery",
    "langchain-openrouter>=0.2.9,<1.0.0",
]

[dependency-groups]
# The index image serves the directory, not tools — it needs the runtime and
# none of the toolsets. `uv sync --only-group index` in the Dockerfile installs
# exactly this, at the version uv.lock already pins for everything else.
index = ["mcp-toolsets-runtime"]
dev = [
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio<2.0.0,>=1.4.0",
    "ruff<0.15.0,>=0.14.11",
    "mypy<2.0.0,>=1.19.1",
    "types-shapely<3.0.0,>=2.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["toolsets/*"]

# Only the toolsets are local; the runtime resolves from PyPI like any other
# third-party dependency.
[tool.uv.sources]
duckdb-analyst = { workspace = true }
naip-imagery = { workspace = true }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests", "toolsets"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*", "planetary_computer.*"]
ignore_missing_imports = true
