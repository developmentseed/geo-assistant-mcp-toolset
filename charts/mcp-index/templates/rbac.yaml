apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-index
  labels:
    {{- include "mcp-index.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-index
  labels:
    {{- include "mcp-index.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-index
  labels:
    {{- include "mcp-index.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-index
subjects:
  - kind: ServiceAccount
    name: mcp-index
    namespace: {{ .Release.Namespace }}
