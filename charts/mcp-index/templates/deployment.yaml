apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-index
  labels:
    {{- include "mcp-index.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "mcp-index.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-index.labels" . | nindent 8 }}
    spec:
      serviceAccountName: mcp-index
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: mcp-index
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          command: [mcp-index]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PUBLIC_URL
              value: "http{{ if .Values.ingress.tlsSecret }}s{{ end }}://{{ include "mcp-index.host" . }}"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
