apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-chat
  labels:
    {{- include "mcp-chat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "mcp-chat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-chat.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: mcp-chat
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          command: [mcp-agent-web]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # No PROVIDER_API_KEY: the model is bring-your-own, set per session
            # in the UI. Only the index URL and Chainlit bind config are baked in.
            - name: MCP_URL
              value: {{ .Values.mcpUrl | quote }}
            - name: CHAINLIT_HOST
              value: "0.0.0.0"
            - name: CHAINLIT_PORT
              value: {{ .Values.service.port | quote }}
          # Chainlit has no dedicated health route; a TCP check confirms the
          # server is accepting connections.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
