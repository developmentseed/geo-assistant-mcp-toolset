apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-chat
  labels:
    {{- include "mcp-chat.labels" . | nindent 4 }}
  {{- if or (and .Values.ingress.tlsSecret .Values.ingress.clusterIssuer) .Values.ingress.annotations }}
  annotations:
    {{- if and .Values.ingress.tlsSecret .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ include "mcp-chat.host" $ | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ include "mcp-chat.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-chat
                port:
                  name: http
