{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-toolset.fullname" . }}
  labels:
    {{- include "mcp-toolset.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled" $.Values.ingress.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /{{ include "mcp-toolset.name" . }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "mcp-toolset.fullname" . }}
                port:
                  name: http
{{- end }}
