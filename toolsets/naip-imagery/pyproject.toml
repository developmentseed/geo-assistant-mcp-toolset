[project]
name = "naip-imagery"
version = "0.1.0"
description = "NAIP aerial imagery over the session's area of interest: STAC search on Microsoft Planetary Computer, an RGB JPEG rendered server-side, and an Ollama vision model to interpret it."
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx<1.0.0,>=0.28.1",
    "langchain-core<2.0.0,>=1.4.6",
    "mcp-toolsets-runtime",
    "numpy<3.0.0,>=2.5.2",
    "odc-stac<1.0.0,>=0.5.3",
    "pillow<13.0.0,>=12.3.0",
    "planetary-computer<2.0.0,>=1.0.0",
    "pystac-client<1.0.0,>=0.9.0",
    "python-dotenv<2.0.0,>=1.2.2",
    "shapely<3.0.0,>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Views are built by ui/ (vite) into the package's views/ dir; they are
# git-ignored build artifacts, so force them into the wheel.
artifacts = ["src/naip_imagery/views/*.html"]
